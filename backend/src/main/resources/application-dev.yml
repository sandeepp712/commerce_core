spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce
    username: ecommerce
    password: ecommerce

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: ecommerce
    password: ecommerce

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Enable Swagger in dev
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

logging:
  level:
    root: INFO
    com.commercecore.backend: INFO          # Your app code
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: OFF   # SQL queries (WARN = only problems)
    org.hibernate.type.descriptor.sql: OFF   # Bind parameters (very noisy)
    org.springframework.security: WARN
    org.springframework.amqp: INFO
    org.springframework.scheduling: INFO