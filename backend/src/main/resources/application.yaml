spring:
  application:
    name: commerce-core

  # Database
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ecommerce}
    username: ${DATABASE_USERNAME:ecommerce}
    password: ${DATABASE_PASSWORD:ecommerce}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  #Task Scheduling
  task:
    scheduling:
      pool:
        size: 2

jwt:
  secret: ${JWT_SECRET}


stripe:
  webhook:
      signing-secret: ${STRIPE_WEBHOOK_SECRET}

flash-sale:
  redis-key-prefix: ${FLASH_SALE_REDIS_PREFIX:stock:product:}
  lock-key-prefix: ${FLASH_SALE_LOCK_PREFIX:lock:stock:}
  queue-name: ${FLASH_SALE_QUEUE:flash-sale-orders}
  exchange-name: ${FLASH_SALE_EXCHANGE:flash-sale-exchange}
  routing-key: ${FLASH_SALE_ROUTING_KEY:order.confirmed}

# ─── Server ─────────────────────────────────────────────────────────────
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    com.commercecore.backend: INFO
    org.springframework.security: WARN
    org.springframework.amqp: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) [%thread] [%X{requestId:-NO-REQ}] %cyan(%logger{36}) - %msg%n"


# ─── Actuator (RESTRICTED) ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      roles: ACTUATOR_ADMIN
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: commerce-core
      environment: ${SPRING_PROFILES_ACTIVE:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false
    db:
      enabled: true