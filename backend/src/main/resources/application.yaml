spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5435/ecommerce
    username: ecommerce
    password: ecommerce
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  task:
    scheduling:
      pool:
        size: 2
  rabbitmq:
    host: localhost
    port: 5672
    username: ecommerce
    password: ecommerce
    listener:
      simple:
        acknowledge-mode: manual    # we manually ACK after successfull DB write
        prefetch: 10                # Consume processes 10 message at a time
        retry:
          enabled: true
          max-retries: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms

jwt:
  secret: ${JWT_SECRET}


stripe:
  webhook:
      signing-secret: ${STRIPE_WEBHOOK_SECRET}


logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    com.commercecore.backend: INFO

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: commerce-core
    distribution:
      percentiles-histogram:
        http.server.requests: true

flash-sale:
  redis-key-prefix: "stock:product:"
  lock-key-prefix: "lock:stock:"
  queue-name: "flash-sale-orders"
  exchange-name: "flash-sale-exchange"
  routing-key: "order.confirmed"