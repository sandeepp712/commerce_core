spring:
  # All credentials come from environment variables
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}


# DISABLE Swagger in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Production logging (structured JSON for CloudWatch)
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    com.commercecore.backend: INFO
    org.hibernate.type.descriptor: OFF
    org.springframework.security: WARN
    org.springframework.scheduling: INFO
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%level","thread":"%thread","requestId":"%X{requestId:-}","logger":"%logger","message":"%msg"}%n'

# Restrict actuator in production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

  health:
    rabbit:
      enabled: false         # CRITICAL: Prevents "DOWN" status since RabbitMQ isn't deployed
    redis:
      enabled: false         # CRITICAL: Prevents "DOWN" status since Redis isn't deployed
    metrics:
      tags:
        application: commerce-core

# Production server settings
server:
  tomcat:
    max-threads: ${TOMCAT_MAX_THREADS:200}
    min-spare-threads: ${TOMCAT_MIN_SPARE:20}
    accept-count: ${TOMCAT_ACCEPT_COUNT:100}

